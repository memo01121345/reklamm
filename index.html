<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCD Reklam Ekranı – Kasım 2026</title>
<style>
:root{--h:210;--bg:hsl(var(--h) 45% 8%);--ac:hsl(var(--h) 90% 62%);--ac2:hsl(calc(var(--h) + 40) 90% 60%);--tx:#f4f6fb;--mu:hsl(var(--h) 20% 72%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:"Bahnschrift","Segoe UI",system-ui,sans-serif;color:var(--tx);cursor:none}
body:hover{cursor:default}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden;transition:background .6s}
#content{position:absolute;inset:0 0 90px 0;transition:opacity .35s}
#content.out{opacity:0}
.txt{position:absolute;left:100px;top:0;bottom:0;width:900px;display:flex;flex-direction:column;justify-content:center;gap:44px;z-index:2}
.chip{align-self:flex-start;padding:10px 26px;border:2px solid var(--ac);border-radius:40px;font-size:34px;color:var(--ac)}
.logo{align-self:flex-start;display:flex;align-items:center;gap:20px;padding:14px 40px 14px 14px;background:#fff;color:hsl(var(--h) 85% 28%);border-radius:30px;font-size:46px;font-weight:800;letter-spacing:-.5px;box-shadow:0 14px 44px rgba(0,0,0,.4)}
.logo svg{width:84px;height:84px;flex:none}
h1{font-size:112px;line-height:1.02;font-weight:800;letter-spacing:-2px;text-wrap:balance}
.offer{align-self:flex-start;padding:26px 40px;font-size:46px;font-weight:700;color:#10131c;background:linear-gradient(100deg,var(--ac),var(--ac2));border-radius:14px 44px 14px 44px}
.sub{font-size:34px;color:var(--mu)}
.vis{position:absolute;right:0;top:0;width:960px;height:100%;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);background:#000;z-index:1}
.vis canvas,.vis svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
.badge{position:absolute;left:190px;bottom:44px;z-index:3;padding:10px 22px;border-radius:10px;background:rgba(0,0,0,.55);font-size:26px;font-variant-numeric:tabular-nums}
.badge i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#ff3b3b;margin-right:12px;animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
#bar{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.7));backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.16);display:flex;align-items:center;gap:36px;padding:0 50px;font-size:30px}
#tag{flex:none;display:flex;align-items:center;gap:12px;padding:12px 28px;border-radius:40px;font-size:26px;font-weight:800;color:#10131c;background:linear-gradient(100deg,var(--ac),var(--ac2))}
#tag i{width:12px;height:12px;border-radius:50%;background:#10131c;animation:b 1s infinite}
#prog{position:absolute;left:0;top:0;height:5px;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
#clock{font-weight:700;min-width:300px;font-variant-numeric:tabular-nums}
#clock small{display:block;font-size:23px;font-weight:400;color:var(--mu)}
#tick{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#tick div{display:inline-flex;gap:40px;animation:mq var(--d,120s) linear infinite}
.ti{display:inline-flex;align-items:center;gap:14px;font-size:34px}
.ti span{color:var(--mu)}
.ti b{padding:6px 20px;border-radius:30px;font-size:31px;font-weight:800;color:#10131c;background:hsl(var(--c) 88% 64%)}
@keyframes mq{to{transform:translateX(-50%)}}
#cnt{font-variant-numeric:tabular-nums;color:var(--ac);font-weight:700}
#hint{position:absolute;right:20px;top:14px;font-size:18px;color:rgba(255,255,255,.35);z-index:5}
@media (prefers-reduced-motion:reduce){.vis svg,#tick div{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="content"></div>
  <div id="bar">
    <div id="prog"></div>
    <div id="tag"><i></i>Kasım 2026</div>
    <div id="clock"></div>
    <div id="tick"><div id="tk"></div></div>
    <div id="cnt"></div>
  </div>
</div>
